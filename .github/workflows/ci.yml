name: ci

on:
  push:
    branches: [master]
  pull_request:

# Cancel an in-flight run when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `golangci-lint-action` v8+ requires golangci-lint v2.1+. v2.x is the
  # only line that builds against current Go releases — `version: latest`
  # on older majors resolves to v1.64.x and fails on go.mod >= 1.26.
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  test-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./... -race -short

  # build-ui builds the SPA and verifies the committed web/dist matches.
  # `bun run build` already runs vue-tsc, so a typecheck regression fails
  # the build step itself.
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install SPA deps
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build SPA
        working-directory: web
        run: bun run build
