name: release

# Manual only. The operator passes an existing git tag (e.g. v1.2.3); the
# workflow checks out that ref, builds the SPA, then runs goreleaser to
# publish a draft GitHub release with archives + checksums.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # Skip the sign step if COSIGN_OIDC_PROVIDER is not set or empty
          args: release --clean ${{ vars.COSIGN_OIDC_PROVIDER && '' || '--skip=sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_OIDC_PROVIDER: ${{ vars.COSIGN_OIDC_PROVIDER }}
