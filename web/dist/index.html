    <title>huetension</title>
    <script>
      // Resolve the persisted theme before first paint so reloads don't
      // flash the wrong tokens. Keeps the runtime store as the single
      // source of truth; this script only seeds the initial attribute.
      // useStorage (vueuse) writes raw strings for string defaults, so
      // localStorage holds 'light' / 'dark' / 'system' verbatim.
      (function () {
        try {
          var stored = localStorage.getItem('huetension:theme');
          var resolved;
          if (stored === 'light' || stored === 'dark') {
            resolved = stored;
          } else {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
