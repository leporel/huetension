# huetension.example.yaml - annotated example config.
#
# Copy this file to the data directory as config.yaml.
#
# Default data directory:
#   Linux/macOS: ~/.config/huetension/
#   Windows:     %APPDATA%\huetension\
#
# Override the data directory with --data-dir or HUETENSION_DATA_DIR.
#
# Precedence: flag > HUETENSION_* env > config.yaml > built-in default.
#
# Important: at the moment the program only reads the `mcp:` section from
# config.yaml. Other command settings are configured through flags/env vars.

# Environment variables recognised at runtime:
#
#   HUETENSION_DATA_DIR
#     Overrides the data directory that contains config.yaml and library.json.
#     Equivalent to --data-dir. The directory must already exist when set.
#
#   HUETENSION_MCP_ENABLE
#     Comma-separated equivalent of mcp.enable.
#     Example: HUETENSION_MCP_ENABLE=color.convert,harmony.generate
#
#   HUETENSION_MCP_DISABLE
#     Comma-separated equivalent of mcp.disable.
#     Example: HUETENSION_MCP_DISABLE=image.extract,image.extractBatch
#
#   NO_COLOR
#     Disables ANSI color in text output when the variable is present.
#     Any value is accepted; an empty value still disables color.
#
# Developer/test-only environment variables:
#
#   HUETENSION_GEN_PARITY=1
#     Enables parity fixture regeneration in selected Go tests. It is not
#     consumed by normal CLI, web, serve, or MCP runtime paths.

# MCP selector configuration. Shared by `huetension mcp` and
# `huetension serve`; both commands use this same section to decide which
# MCP tools, resources, and prompts are exposed.
mcp:
  # Whitelist. When non-empty for a selector kind, only listed entries of
  # that kind are exposed. Leave empty to expose every default-enabled
  # entry of that kind.
  #
  # Environment variable: HUETENSION_MCP_ENABLE
  enable: []

  # Blacklist. Applied after `enable`; listed entries are removed from the
  # exposed set. Leave empty to disable nothing.
  #
  # Environment variable: HUETENSION_MCP_DISABLE
  disable: []

# Selector syntax for mcp.enable / mcp.disable:
#
#   color.convert                 # bare names select tools
#   tools:color.convert           # explicit tool selector
#   tools:*                       # all tools
#   resources:huetension://schemas/v1
#   resources:*                   # all resources
#   prompts:extract-from-mood
#   prompts:*                     # all prompts
#
# Known tool selectors:
#
#   - color.convert
#   - color.sort
#   - harmony.generate
#   - gradient.generate
#   - contrast.check
#   - blindness.simulate
#   - palette.random
#   - export.css
#   - export.tailwind
#   - image.extract
#   - image.extractBatch
#   - library.categories
#   - library.list
#   - library.get
#   - library.save
#
# Known resource selectors:
#
#   - resources:huetension://schemas/v1
#
# Known prompt selectors:
#
#   - prompts:extract-from-mood
#   - prompts:audit-contrast
#
# Common blacklist example:
#
# mcp:
#   disable:
#     - image.extract
#     - image.extractBatch
#     - library.save
#
# Common whitelist example:
#
# mcp:
#   enable:
#     - color.convert
#     - color.sort
#     - harmony.generate
#     - contrast.check
#     - library.list
#     - library.get
#
# Whitelist everything, then subtract specific entries:
#
# mcp:
#   enable:
#     - tools:*
#     - resources:*
#     - prompts:*
#   disable:
#     - image.extract
#     - image.extractBatch
